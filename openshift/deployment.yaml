# The EKS Deployment, ported to OpenShift. Diff this against k8s/deployment.yaml —
# the differences are all forced by the restricted-v2 SCC, and every one of them
# is explained in docs/openshift.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: web }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: web }
      # CHANGED: no runAsUser, no fsGroup.
      # OpenShift's restricted-v2 SCC assigns each namespace a UID range and injects
      # a UID from it. Hard-coding runAsUser: 10001 gets the pod REJECTED unless
      # 10001 happens to fall in that namespace's range — which it will not.
      # runAsNonRoot stays: it is an assertion, not an assignment.
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/demo/web:v1
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: APP_VERSION
              value: "v1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # The injected UID has no /etc/passwd entry. Anything that calls
            # getpwuid() — including some Python startup paths and many shells —
            # fails with "unknown user". HOME must be set explicitly.
            - name: HOME
              value: /tmp
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

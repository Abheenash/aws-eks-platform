# Checkov config. `skip-check` is a REVIEWED baseline — each entry is an accepted
# trade-off or a demonstrated false positive, with the reason. Everything else is
# a hard gate: a NEW category of misconfiguration in a PR fails the build.
# Scans the WHOLE repo, not just terraform/.
#
# This file used to say `directory: [terraform]`, and CI did not run checkov at
# all — nine jobs, none of them this one — so the config sat here looking like a
# gate while the only thing consuming it was a pre-commit hook nobody had run.
# Running it found a real finding on the first go: CKV_K8S_38, the pod mounting a
# service-account token for an API server it never talks to. Both deployments now
# set automountServiceAccountToken: false, and CI has a checkov job.
compact: true
quiet: true
skip-check:
  # CKV_TF_1 wants every module source pinned to a git commit hash. These are
  # Terraform REGISTRY modules (terraform-aws-modules/eks, /vpc, /eks-pod-identity),
  # which are versioned by the registry and pinned with `version = "~> 21.0"` plus
  # a committed .terraform.lock.hcl. There is no commit hash to give — the check
  # only applies to git-sourced modules.
  - CKV_TF_1

  # CKV_K8S_43 (image by digest) and CKV_K8S_15 (imagePullPolicy: Always) are the
  # same concern twice: a mutable tag can be republished under you. The committed
  # manifests carry `:v1` as a readable placeholder, and .github/workflows/deploy.yml
  # substitutes `:${GITHUB_SHA::12}` — a tag that is immutable in practice because
  # it names one commit and is never reused. `Always` on top of that would re-pull
  # an identical layer set on every pod start for no benefit.
  #
  # Digest pinning is strictly stronger and is not adopted here for a stated reason:
  # Argo CD reconciles these manifests from git, so a digest in the manifest means a
  # bot commit per build. That is a real and common choice — it is just not this
  # repo's, and pretending the check passes would be worse than saying so.
  - CKV_K8S_43
  - CKV_K8S_15

  # CKV_DOCKER_2 wants a Docker HEALTHCHECK. In Kubernetes the kubelet's probes
  # supersede it entirely — this deployment has three (startup /healthz, readiness
  # /ready, liveness /healthz) and the kubelet never reads a HEALTHCHECK. Adding
  # one would put a second, unused health definition in the tree that could drift
  # from the real one.
  - CKV_DOCKER_2

  # CKV_K8S_40 wants an explicit high runAsUser. openshift/deployment.yaml
  # deliberately omits it: OpenShift's restricted-v2 SCC allocates a UID from the
  # namespace's range and REJECTS a pod that names its own. The AWS manifest does
  # set runAsUser: 10001 and passes. docs/openshift.md is the write-up.
  - CKV_K8S_40

  # CKV_AWS_394 wants the aws_availability_zones data source to allowlist zones by
  # zone-name or zone-id, so the result set cannot expand when AWS adds an AZ. The
  # concern behind it is real and specific: if the AZ set shifts between applies,
  # the VPC's subnets are destroyed and recreated.
  #
  # It does not apply here. terraform/main.tf takes `slice(..., 0, 2)` of a list the
  # provider returns sorted, and in every AWS region new zones are appended with
  # later suffixes — a new us-east-1g cannot sort ahead of 1a and 1b. Pinning by
  # zone-name instead would hardcode region-specific strings and break `var.region`,
  # trading a risk that cannot occur for one that can.
  - CKV_AWS_394

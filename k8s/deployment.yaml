apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # zero-downtime rollout
      maxSurge: 1
  template:
    metadata:
      labels: { app: web }
    spec:
      # Spread pods across nodes so a node loss can't take out all replicas.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: web }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      # Drill finding (docs/RESULTS-2026-07-12.md): 3 of 400 requests got 502s while a
      # pod was replaced, because the ALB kept routing to it after SIGTERM. The fix has
      # three parts that must agree:
      #   1. preStop sleeps 15 s -> the pod keeps serving while the ALB deregisters it
      #      (the app also flips /ready to 503 on SIGTERM so the target drains first)
      #   2. the Ingress sets deregistration_delay = 15 s (default is 300 s)
      #   3. terminationGracePeriodSeconds > preStop + the drain -> no forced kill
      terminationGracePeriodSeconds: 45
      # The app makes no Kubernetes API calls — no client library, no kubeconfig,
      # nothing reading /var/run/secrets/kubernetes.io. Mounting a token it never
      # uses just hands an attacker with code execution a credential for the API
      # server. (checkov CKV_K8S_38.)
      #
      # This does NOT disable EKS Pod Identity: the Pod Identity webhook injects its
      # own projected volume for the agent token, which is a separate mount from the
      # default service-account token this turns off. Stated rather than demonstrated
      # — this repo is validated and never applied, so there is no live EKS cluster to
      # prove it on. What IS verified is the half that matters for the app itself:
      # it has no Kubernetes client in requirements.txt and never reads the token.
      automountServiceAccountToken: false
      containers:
        - name: app
          # CI overrides the tag via `kubectl set image`; :v1 is the default.
          image: 638515252275.dkr.ecr.us-east-1.amazonaws.com/aws-eks-platform:v1
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: APP_VERSION
              value: "v1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          # Liveness and readiness are different questions and different endpoints:
          # /healthz only proves the process answers; /ready says "send me traffic".
          # Drill finding: a pod restarted under load because the probe timed out at
          # the default 1 s while a busy-loop held the GIL. The loop now runs in a child
          # process (app/main.py), and the probe gets a realistic timeout and 3 misses.
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 15   # up to 30 s to start before liveness kicks in
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

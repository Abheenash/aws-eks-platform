name: ci
on: [push, pull_request]
jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r app/requirements.txt -r tests/requirements.txt
      - run: python -m pytest tests -q
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubeconform (strict schema validation)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/*.yaml
      - name: policy — the drill fixes must stay in place
        run: |
          python3 - <<'EOF'
          import yaml, sys
          dep = yaml.safe_load(open("k8s/deployment.yaml"))
          c = dep["spec"]["template"]["spec"]["containers"][0]
          spec = dep["spec"]["template"]["spec"]
          assert "sleep" in " ".join(c["lifecycle"]["preStop"]["exec"]["command"]), "preStop drain missing"
          assert spec["terminationGracePeriodSeconds"] > 15, "grace period must exceed the preStop sleep"
          assert c["livenessProbe"]["httpGet"]["path"] != c["readinessProbe"]["httpGet"]["path"], "liveness and readiness must be different endpoints"
          assert c["livenessProbe"]["timeoutSeconds"] >= 3 and c["livenessProbe"]["failureThreshold"] >= 3
          assert c["securityContext"]["readOnlyRootFilesystem"] and not c["securityContext"]["allowPrivilegeEscalation"]
          assert "limits" in c["resources"] and "requests" in c["resources"]
          ing = yaml.safe_load(open("k8s/ingress.yaml"))
          attrs = ing["metadata"]["annotations"]["alb.ingress.kubernetes.io/target-group-attributes"]
          assert "deregistration_delay.timeout_seconds=15" in attrs, "deregistration delay must match preStop"
          assert ing["metadata"]["annotations"]["alb.ingress.kubernetes.io/healthcheck-path"] == "/ready"
          pdb = yaml.safe_load(open("k8s/pdb.yaml"))
          assert pdb["spec"]["minAvailable"] >= 1
          print("manifest policy ok")
          EOF
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --platform linux/amd64 -t eks-demo:ci app/
      - run: test "$(docker run --rm --entrypoint id eks-demo:ci -u)" = "10001"
      - name: trivy
        run: |
          # Pinned, not @main — trivy's supply chain was compromised twice in
          # March 2026 (CVE-2026-33634). v0.69.3 predates the malicious releases.
          TRIVY_VERSION=v0.69.3
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION#v}"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 eks-demo:ci

  # tflint catches what `terraform validate` cannot: unused declarations, missing
  # provider version constraints, invalid instance types. It found an unpinned
  # `archive` provider in two of these repos.
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.64.0
      - name: tflint
        working-directory: ${{ github.workspace }}
        run: |
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          tflint --chdir=terraform --config="${{ github.workspace }}/.tflint.hcl"

  # `terraform test` against a mocked provider: no cloud account, no cost. It
  # asserts the specific promises this repo's README makes — which a generic
  # scanner cannot know.
  terraform-test:
    name: terraform test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: terraform test
        working-directory: ${{ github.workspace }}/terraform
        run: |
          terraform init -backend=false
          terraform test

  # Lint, including bandit's security rules. Every exclusion in ruff.toml carries
  # the reason it is there — a silent exclusion is indistinguishable from a bug
  # nobody noticed.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.8
          args: check --output-format github

  # GitHub's semantic analysis, free on public repos, reporting into the Security
  # tab. It reads data flow across files, which neither ruff nor checkov does.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

  # Blocks a PR that introduces a dependency with a known vulnerability or a
  # licence that does not fit. Renovate keeps things current; this stops a bad
  # one arriving in the first place.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

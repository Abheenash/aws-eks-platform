name: build-and-deploy

on:
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

# Keyless auth to AWS via GitHub OIDC — no static access keys anywhere.
# contents: write is what lets the deploy job commit the new image tag back to
# git; that commit IS the deployment now, and Argo CD reconciles it.
permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPO: aws-eks-platform
  CLUSTER: eks-platform

# The cluster runs build -> prove -> destroy, so deploys are opt-in: set the
# repository variable DEPLOY_ENABLED=true while the cluster is up.
jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push image (linux/amd64)
        id: img
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REG/$ECR_REPO:${GITHUB_SHA::12}"
          # EKS nodes are amd64 — build for the target platform explicitly
          # (the arm64->amd64 lesson from secure-container-pipeline).
          docker build --platform linux/amd64 -t "$IMAGE" -t "$REG/$ECR_REPO:latest" app/
          docker push "$IMAGE"
          docker push "$REG/$ECR_REPO:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # GitOps: CI does not talk to the cluster at all. It writes the new image tag
  # into k8s/deployment.yaml and pushes; Argo CD (running inside the cluster)
  # notices the commit and reconciles. This is why the deploy job needs no AWS
  # credentials and no kubectl — the cluster pulls, CI does not push.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pin the new image in the manifest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          # Rewrite only the app container's image line, leave everything else.
          before=$(grep -c '^\s*image:' k8s/deployment.yaml)
          if [ "$before" -ne 1 ]; then
            echo "::error::expected exactly one 'image:' line in k8s/deployment.yaml, found $before"
            exit 1
          fi
          sed -i -E "s|^(\s*image:\s*).*|\1${IMAGE}|" k8s/deployment.yaml
          grep '^\s*image:' k8s/deployment.yaml

      - name: Commit the release
        run: |
          if git diff --quiet; then
            echo "::notice::Manifest already at this image — nothing to release."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "release: ${GITHUB_SHA::12}"
          git push

      - name: Where to watch it land
        run: |
          echo "::notice::Argo CD reconciles within ~3 min. Watch with:"
          echo "  kubectl -n argocd port-forward svc/argocd-server 8080:80"
          echo "  argocd app get web"

# Local gates that mirror CI, so a broken commit never reaches a PR.
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are Go templates that happen to end in .yaml; `{{ ... }}`
        # in a value position is not valid YAML and never will be, so this hook
        # can only ever fail on them. `helm lint` is the right tool for that
        # directory. Excluding it is the fix; the alternative was a hook that
        # every developer would learn to skip.
        exclude: ^gitops/.*/templates/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.5
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
      - id: terraform_checkov
        args: [--args=--quiet, --args=--compact]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

# A second local cluster, for the one thing the main one cannot test.
#
# kind's default CNI (kindnet) ACCEPTS NetworkPolicy objects and enforces none of
# them — which makes it worse than no CNI for this purpose, because the manifests
# apply cleanly and appear to work. Disabling it and installing Calico gives real
# enforcement, and that is the same distinction that matters on EKS, where the VPC
# CNI needs enableNetworkPolicy=true before any policy does anything.
#
#   kind create cluster --config local/kind-netpol.yaml
#   kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.0/manifests/calico.yaml
#   kubectl apply -f k8s/networkpolicy.yaml
#
# See docs/drills/2026-09-24-kind-cluster.md section 7 — running this is what caught
# an ingress rule with no `from`, which allowed every source instead of one.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: np-test
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16" # Calico's default
nodes:
  - role: control-plane
  - role: worker
